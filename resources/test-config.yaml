general:
  startup_commands: []
  shutdown_commands: []
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false

  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'

  hide_method: 'hide'
  show_all_in_taskbar: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'

keybindings:
  - commands: ['focus-all-workspaces 1']
    bindings: ['alt+1']

  - commands: ['focus-all-workspaces 2']
    bindings: ['alt+2']

  - commands: ['focus-all-workspaces 3']
    bindings: ['alt+3']

  - commands: ['focus-all-workspaces 4']
    bindings: ['alt+4']
